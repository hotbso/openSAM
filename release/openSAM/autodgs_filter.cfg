#
# autodgs_filter.cfg
#
# Additional filter for AutoDGS behavior
#
# Copy this file to "<xp_root>/Output/openSAM/autodgs_filter.cfg" to make it effective
#
# The candidate pool consists of all airports with a paved runway and a tower frequency.
#
# Each entry starts with an an explicit ICAO code or a glob pattern (*?) in [], e.g. [EDD?]
# followed by a list of keywords.
#
# Recognized keywords are
# "disabled":               no DGS service at all
# "enabled":                enable DGS service
# "dgs": marshaller|default type of DGS service, either marshaller or default (= stands with a jetway get a VDGS, all others get a marshaller
#
# The most specific ICAO wins over a glob match, even if the glob pattern appears earlier in the file.
#

# Example 1:
#[EDFE]
#disabled
#
#[EDLO]
#disabled
#
#[*]
#dgs marshaller # for all others only marshaller
#
#[EDD?]
#dgs default    # except for large German airports

# Example 2: Disable AutoDGS for all airports except EDD*
#[EDD*]
#enabled
#
#[*]
#disabled
